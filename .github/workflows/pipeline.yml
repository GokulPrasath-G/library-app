name: Library Management CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Initialize Python 3.12 Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Automated Test Suite
      run: |
        python -m pytest -v

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up QEMU Container Drivers
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx Engines
      uses: docker/setup-buildx-action@v3

    - name: Authenticate against Docker Hub Platform Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Compile and Push Container Artifact
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/library-manager:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/library-manager:${{ github.sha }}
